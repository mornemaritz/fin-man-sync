info:
  name: Get an account
  type: http
  seq: 3
  tags:
    - Accounts

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/accounts/:account_id"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: account_id
      value: ""
      type: path
      description: The id of the account
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The requested account
    request:
      url: "{{baseUrl}}/plans/:plan_id/accounts/:account_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: account_id
          value: ""
          type: path
          description: The id of the account
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "account": ""
            }
          }
  - name: 404 Response
    description: The requested account was not found
    request:
      url: "{{baseUrl}}/plans/:plan_id/accounts/:account_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: account_id
          value: ""
          type: path
          description: The id of the account
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns a single account
