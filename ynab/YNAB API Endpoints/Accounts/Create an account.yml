info:
  name: Create an account
  type: http
  seq: 2
  tags:
    - Accounts

http:
  method: POST
  url: "{{baseUrl}}/plans/:plan_id/accounts"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan ("last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan)'
  body:
    type: json
    data: |-
      {
        "account": {
          "name": "",
          "type": "checking",
          "balance": 0
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: The account was successfully created
    request:
      url: "{{baseUrl}}/plans/:plan_id/accounts"
      method: POST
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan ("last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan)'
      body:
        type: json
        data: |-
          {
            "account": {
              "name": "",
              "type": "checking",
              "balance": 0
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "account": ""
            }
          }
  - name: 400 Response
    description: The request could not be understood due to malformed syntax or validation error(s).
    request:
      url: "{{baseUrl}}/plans/:plan_id/accounts"
      method: POST
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan ("last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan)'
      body:
        type: json
        data: |-
          {
            "account": {
              "name": "",
              "type": "checking",
              "balance": 0
            }
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

