info:
  name: Get a payee
  type: http
  seq: 3
  tags:
    - Payees

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/payees/:payee_id"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: payee_id
      value: ""
      type: path
      description: The id of the payee
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The requested payee
    request:
      url: "{{baseUrl}}/plans/:plan_id/payees/:payee_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: payee_id
          value: ""
          type: path
          description: The id of the payee
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "payee": {
                "id": "",
                "name": "",
                "transfer_account_id": "",
                "deleted": false
              }
            }
          }
  - name: 404 Response
    description: The payee was not found
    request:
      url: "{{baseUrl}}/plans/:plan_id/payees/:payee_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: payee_id
          value: ""
          type: path
          description: The id of the payee
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns a single payee
