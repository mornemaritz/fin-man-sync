info:
  name: Get all money movement groups
  type: http
  seq: 3
  tags:
    - Money Movements

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/money_movement_groups"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The list of requested money movement groups
    request:
      url: "{{baseUrl}}/plans/:plan_id/money_movement_groups"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "money_movement_groups": [
                {
                  "id": "",
                  "group_created_at": "",
                  "month": "",
                  "note": "",
                  "performed_by_user_id": ""
                }
              ],
              "server_knowledge": 0
            }
          }
  - name: 404 Response
    description: No money movement groups were found
    request:
      url: "{{baseUrl}}/plans/:plan_id/money_movement_groups"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns all money movement groups
