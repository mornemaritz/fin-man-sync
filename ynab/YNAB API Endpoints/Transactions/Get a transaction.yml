info:
  name: Get a transaction
  type: http
  seq: 5
  tags:
    - Transactions

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/transactions/:transaction_id"
  params:
    - name: plan_id
      value: "{{YNAB_BUDGET_ID}}"
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: transaction_id
      value: 7caaa57d-5fd7-45a9-a10c-39d53881c85e
      type: path
      description: The id of the transaction
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The requested transaction
    request:
      url: "{{baseUrl}}/plans/:plan_id/transactions/:transaction_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: transaction_id
          value: ""
          type: path
          description: The id of the transaction
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "transaction": "",
              "server_knowledge": 0
            }
          }
  - name: 404 Response
    description: The transaction was not found
    request:
      url: "{{baseUrl}}/plans/:plan_id/transactions/:transaction_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: transaction_id
          value: ""
          type: path
          description: The id of the transaction
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns a single transaction
