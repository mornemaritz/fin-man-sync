info:
  name: Get a category for a specific plan month
  type: http
  seq: 5
  tags:
    - Categories

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/months/:month/categories/:category_id"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: month
      value: ""
      type: path
      description: The plan month in ISO format (e.g. 2016-12-01) ("current" can also be used to specify the current calendar month (UTC))
    - name: category_id
      value: ""
      type: path
      description: The id of the category
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The requested month category
    request:
      url: "{{baseUrl}}/plans/:plan_id/months/:month/categories/:category_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: month
          value: ""
          type: path
          description: The plan month in ISO format (e.g. 2016-12-01) ("current" can also be used to specify the current calendar month (UTC))
        - name: category_id
          value: ""
          type: path
          description: The id of the category
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "category": ""
            }
          }
  - name: 404 Response
    description: The month category was not was found
    request:
      url: "{{baseUrl}}/plans/:plan_id/months/:month/categories/:category_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: month
          value: ""
          type: path
          description: The plan month in ISO format (e.g. 2016-12-01) ("current" can also be used to specify the current calendar month (UTC))
        - name: category_id
          value: ""
          type: path
          description: The id of the category
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns a single category for a specific plan month.  Amounts (assigned, activity, available, etc.) are specific to the current plan month (UTC).
