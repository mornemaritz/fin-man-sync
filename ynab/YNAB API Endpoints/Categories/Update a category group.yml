info:
  name: Update a category group
  type: http
  seq: 8
  tags:
    - Categories

http:
  method: PATCH
  url: "{{baseUrl}}/plans/:plan_id/category_groups/:category_group_id"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: category_group_id
      value: ""
      type: path
      description: The id of the category group
  body:
    type: json
    data: |-
      {
        "category_group": {
          "name": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

