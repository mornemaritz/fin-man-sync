info:
  name: Get a category
  type: http
  seq: 3
  tags:
    - Categories

http:
  method: GET
  url: "{{baseUrl}}/plans/:plan_id/categories/:category_id"
  params:
    - name: plan_id
      value: ""
      type: path
      description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
    - name: category_id
      value: ""
      type: path
      description: The id of the category
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: The requested category
    request:
      url: "{{baseUrl}}/plans/:plan_id/categories/:category_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: category_id
          value: ""
          type: path
          description: The id of the category
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "category": ""
            }
          }
  - name: 404 Response
    description: The category was not found
    request:
      url: "{{baseUrl}}/plans/:plan_id/categories/:category_id"
      method: GET
      params:
        - name: plan_id
          value: ""
          type: path
          description: 'The id of the plan. "last-used" can be used to specify the last used plan and "default" can be used if default plan selection is enabled (see: https://api.ynab.com/#oauth-default-plan).'
        - name: category_id
          value: ""
          type: path
          description: The id of the category
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "id": "",
              "name": "",
              "detail": ""
            }
          }

docs: Returns a single category.  Amounts (assigned, activity, available, etc.) are specific to the current plan month (UTC).
